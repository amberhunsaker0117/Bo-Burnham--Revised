<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bo Burnham: Inside</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Indie+Flower&family=Jost:wght@400&display=swap" rel="stylesheet" />
  <style>
    /* ── Reset ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* ── Page Shell ── */
    body {
      background: white;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── Top Banner ── */
    .top-banner {
      width: 100%;
      min-height: clamp(140px, 20vw, 315px);
      flex-shrink: 0;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Gradient on pseudo-element so opacity doesn't affect the title */
    .top-banner::before {
      content: '';
      position: absolute;
      inset: 0;
      opacity: 0.75;
      background: linear-gradient(135deg, #4DC5FF 0%, #4BC0F9 40%, #3EA1D1 100%);
      z-index: 0;
    }

    .top-banner .page-title {
      position: relative;
      z-index: 1;
    }

    /* ── Main Content ── */
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: clamp(1.5rem, 4vw, 3rem) 1rem clamp(2rem, 5vw, 4rem);
      gap: clamp(1.5rem, 3vw, 2.5rem);
    }

    /* ── Heading ── */
    .page-title {
      font-family: 'Indie Flower', cursive;
      font-size: clamp(3rem, 12vw, 9.375rem); /* 150px max */
      font-weight: 400;
      color: black;
      text-align: center;
      line-height: 1.5;
    }

    /* ── Subtitle ── */
    .subtitle {
      font-family: 'Jost', sans-serif;
      font-size: clamp(1rem, 2.5vw, 1.5625rem); /* 25px max */
      font-weight: 400;
      line-height: 1.5;
      color: black;
      text-align: center;
      max-width: 820px;
    }

    /* ── Button Row ── */
    .button-row {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: clamp(1rem, 4vw, 3rem);
      width: 100%;
    }

    .button-row a {
      text-decoration: none;
      display: block;
      flex: 0 1 auto;
    }

    .btn-yes {
      width: clamp(200px, 40vw, 575px);
      height: auto;
      aspect-ratio: 575 / 300;
      object-fit: contain;
    }

    .btn-no {
      width: clamp(160px, 32vw, 452px);
      height: auto;
      aspect-ratio: 452 / 300;
      object-fit: contain;
    }

    /* ── Caption Row ── */
    .caption-row {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: clamp(1rem, 4vw, 3rem);
      width: 100%;
    }

    .caption {
      font-family: 'Jost', sans-serif;
      font-size: clamp(0.9rem, 2vw, 1.5625rem); /* 25px max */
      font-weight: 400;
      line-height: 1.5;
      color: black;
      text-align: center;
      flex: 1 1 240px;
      max-width: 572px;
    }

    /* ── Poster Image ── */
    .poster {
      width: 100%;
      max-width: 1000px;
      height: auto;
      aspect-ratio: 1000 / 585;
      object-fit: contain;
      border-radius: 4px;
    }

    /* ── Bottom Banner ── */
    .bottom-banner {
      width: 100%;
      height: clamp(60px, 10vw, 165px);
      flex-shrink: 0;
      opacity: 0.75;
      background:
        linear-gradient(to bottom right, rgba(255,196,167,0.37) 0%, rgba(237,82,4,0.37) 50%)   bottom right / 50% 50% no-repeat,
        linear-gradient(to bottom left,  rgba(255,196,167,0.37) 0%, rgba(237,82,4,0.37) 50%)   bottom left  / 50% 50% no-repeat,
        linear-gradient(to top left,     rgba(255,196,167,0.37) 0%, rgba(237,82,4,0.37) 50%)   top    left  / 50% 50% no-repeat,
        linear-gradient(to top right,    rgba(255,196,167,0.37) 0%, rgba(237,82,4,0.37) 50%)   top    right / 50% 50% no-repeat;
    }

    /* ── Responsive tweaks ── */
    @media (max-width: 600px) {
      .caption-row {
        flex-direction: column;
        align-items: center;
      }
      .caption {
        max-width: 90vw;
      }
    }
  </style>
</head>
<body>

  <!-- Top blue gradient banner -->
  <div class="top-banner">
    <h1 class="page-title">Hi, There.</h1>
  </div>

  <main>

    <!-- Subtitle -->
    <p class="subtitle">
      Before we can begin, I must know whether you are familiar with the Netflix special
      <br /><em>Bo Burnham: Inside?</em>
    </p>

    <!-- Yes / No buttons -->
    <div class="button-row">
      <a href="./context_homepage.html">
        <img class="btn-yes" src="./images/yesbutton.png" alt="Yes" />
      </a>
      <a href="./no_context_page.html">
        <img class="btn-no" src="./images/nobutton.png" alt="No" />
      </a>
    </div>

    <!-- Captions below buttons -->
    <div class="caption-row">
      <p class="caption">Clicking "Yes" will take you straight to the Homepage of the website.</p>
      <p class="caption">Clicking "No" will take you to a page to explain a little bit about Inside before you see the lyrics.</p>
    </div>

    <!-- Netflix poster -->
    <img class="poster" src="./images/netflixposteryesnopage.png" alt="Bo Burnham: Inside Netflix poster" />
  </main>

  <!-- Bottom orange gradient banner -->
  <div class="bottom-banner"></div>

</body>
</html>
